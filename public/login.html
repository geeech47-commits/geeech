<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Login | Gee-Ech POS</title>
  <style>
    :root {
      --accent: #ff4d4d;
      --bg-gradient: linear-gradient(135deg, #f6f7f9 0%, #e9ecef 100%);
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .login-card {
      background: #ffffff;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
      overflow: hidden; /* Ensures overlay stays inside the card borders */
    }

    .logo-container { 
      margin-bottom: 24px; 
      display: flex;
      justify-content: center;
    }
    
    .logo-img {
      max-width: 100%;
      width: 180px;
      height: auto;
    }
    
    p { color: #94a3b8; margin-bottom: 24px; font-size: 0.875rem; }

    .input-field {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 2px solid #f1f5f9;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .input-field:focus { 
      border-color: var(--accent); 
      outline: none; 
      background: #fff8f8;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #4E2A1E;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    .submit-btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    /* Loading Overlay Styles */
    .loading-overlay {
      display: none; /* Hidden by default */
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #f1f5f9;
      border-top: 4px solid #4E2A1E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    .loading-text {
      color: #4E2A1E;
      font-weight: 600;
      font-size: 0.95rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">Logging in...</div>
    </div>

    <div class="logo-container">
      <img src="logo.jpeg" alt="Fruit'z Logo" class="logo-img">
    </div>
    
    <p>Sign in to access your dashboard</p>
    
    <form id="loginForm">
      <input type="text" id="username" class="input-field" placeholder="Username" required />
      <input type="password" id="password" class="input-field" placeholder="Password" required />
      <button type="submit" id="submitBtn" class="submit-btn">Log In</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const loadingOverlay = document.getElementById('loadingOverlay');
      const submitBtn = document.getElementById('submitBtn');

      // Trigger the loading animation view
      loadingOverlay.style.display = 'flex';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem("fruitz_session", JSON.stringify({ loggedIn: true, user: username }));
          window.location.href = "homepage.html";
        } else {
          loadingOverlay.style.display = 'none';
          submitBtn.disabled = false;
          alert(data.message || "Invalid credentials");
        }
      } catch (error) {
        loadingOverlay.style.display = 'none';
        submitBtn.disabled = false;
        alert("Server connection error.");
      }
    });
  </script>
</body>
</html>
